{% extends 'base.html' %}

{% block title %}Add Donor - Blood Donation Management System{% endblock %}

{% block content %}
<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-user-plus"></i> Add Donor</h2>
        <p class="mb-0">Register as a blood donor</p>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="form-container">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-user-plus"></i> Donor Registration Form</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">
                                        <i class="fas fa-user"></i> Full Name
                                    </label>
                                    <input type="text" name="name" class="form-control" id="name" placeholder="Enter full name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="age" class="form-label">
                                        <i class="fas fa-calendar"></i> Age
                                    </label>
                                    <input type="number" name="age" class="form-control" id="age" placeholder="Enter age" min="18" max="65" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="gender" class="form-label">
                                        <i class="fas fa-venus-mars"></i> Gender
                                    </label>
                                    <select name="gender" class="form-select" id="gender" required>
                                        <option value="">Select Gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="blood_group" class="form-label">
                                        <i class="fas fa-tint"></i> Blood Group
                                    </label>
                                    <select name="blood_group" class="form-select" id="blood_group" required>
                                        <option value="">Select Blood Group</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">
                                        <i class="fas fa-phone"></i> Phone Number
                                    </label>
                                    <input type="tel" name="phone" class="form-control" id="phone" placeholder="Enter phone number" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="city" class="form-label">
                                        <i class="fas fa-city"></i> City
                                    </label>
                                    <input type="text" name="city" class="form-control" id="city" placeholder="Enter city" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="last_donation" class="form-label">
                                    <i class="fas fa-calendar-alt"></i> Last Donation Date (Optional)
                                </label>
                                <input type="date" name="last_donation" class="form-control" id="last_donation">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-blood btn-lg">
                                    <i class="fas fa-user-plus"></i> Add Donor
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
