{% extends 'base.html' %}

{% block title %}Request Blood - Blood Donation Management System{% endblock %}

{% block content %}
<div class="page-header">
    <div class="container">
        <h2><i class="fas fa-hand-holding-medical"></i> Request Blood</h2>
        <p class="mb-0">Submit a blood request for a patient in need</p>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="form-container">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-hand-holding-medical"></i> Blood Request Form</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="patient_name" class="form-label">
                                        <i class="fas fa-user-injured"></i> Patient Name
                                    </label>
                                    <input type="text" name="patient_name" class="form-control" id="patient_name" placeholder="Enter patient name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="blood_group" class="form-label">
                                        <i class="fas fa-tint"></i> Required Blood Group
                                    </label>
                                    <select name="blood_group" class="form-select" id="blood_group" required>
                                        <option value="">Select Blood Group</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="units" class="form-label">
                                        <i class="fas fa-plus-square"></i> Units Required
                                    </label>
                                    <input type="number" name="units" class="form-control" id="units" placeholder="Number of units" min="1" max="10" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="urgency" class="form-label">
                                        <i class="fas fa-exclamation-triangle"></i> Urgency Level
                                    </label>
                                    <select name="urgency" class="form-select" id="urgency" required>
                                        <option value="Normal">Normal</option>
                                        <option value="Urgent">Urgent</option>
                                        <option value="Critical">Critical</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="hospital" class="form-label">
                                        <i class="fas fa-hospital"></i> Hospital Name
                                    </label>
                                    <input type="text" name="hospital" class="form-control" id="hospital" placeholder="Enter hospital name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="city" class="form-label">
                                        <i class="fas fa-city"></i> City
                                    </label>
                                    <input type="text" name="city" class="form-control" id="city" placeholder="Enter city" required>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-blood btn-lg">
                                    <i class="fas fa-paper-plane"></i> Submit Request
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
